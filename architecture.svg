<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AWS secure hybrid cloud network</title>
<desc>hybrid-vpc with public and private subnets, gateway endpoint to S3, and an IPsec VPN to a simulated on-prem VPC running strongSwan. Logging, alerting, patching and automation shown below.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1100" height="700" fill="#FFFFFF"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#2C2C2A">AWS secure hybrid cloud network</text>

<rect x="210" y="50" width="580" height="530" rx="10" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="222" y="68" font-size="12" font-weight="bold" fill="#5F5E5A">AWS Cloud, ap-south-1</text>

<rect x="230" y="80" width="540" height="375" rx="8" fill="#F4F8FD" stroke="#378ADD" stroke-width="1.2"/>
<text x="242" y="97" font-size="12" font-weight="bold" fill="#0C447C">hybrid-vpc 10.20.0.0/16</text>

<rect x="30" y="106" width="150" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="105" y="127" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Internet</text>
<text x="105" y="144" font-size="11" fill="#444441" text-anchor="middle">visitors and admin</text>

<rect x="250" y="108" width="130" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="315" y="133" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Internet gateway</text>

<rect x="630" y="106" width="130" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="695" y="127" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Virtual private</text>
<text x="695" y="144" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">gateway</text>

<line x1="182" y1="128" x2="248" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="315" y1="150" x2="315" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="250" y="160" width="500" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="262" y="181" font-size="11" font-weight="bold" fill="#085041">Public subnets 10.20.1.0/24 and 10.20.2.0/24 | bastion-sg, web-sg | public-nacl</text>

<rect x="270" y="195" width="140" height="64" rx="6" fill="#FFFFFF" stroke="#0F6E56"/>
<text x="340" y="221" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">Bastion</text>
<text x="340" y="239" font-size="11" fill="#0F6E56" text-anchor="middle">SSH from my IP only</text>

<rect x="430" y="195" width="140" height="64" rx="6" fill="#FFFFFF" stroke="#0F6E56"/>
<text x="500" y="221" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">Web server</text>
<text x="500" y="239" font-size="11" fill="#0F6E56" text-anchor="middle">HTTP 80, HTTPS 443</text>

<rect x="250" y="300" width="500" height="130" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="262" y="420" font-size="11" font-weight="bold" fill="#3C3489">Private subnets 10.20.11.0/24 and 10.20.12.0/24 | app-sg | private-nacl | no internet route</text>

<rect x="350" y="335" width="140" height="64" rx="6" fill="#FFFFFF" stroke="#534AB7"/>
<text x="420" y="361" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">App server</text>
<text x="420" y="379" font-size="11" fill="#534AB7" text-anchor="middle">no public IP, IAM role</text>

<rect x="520" y="335" width="140" height="64" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="590" y="361" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Gateway endpoint</text>
<text x="590" y="379" font-size="11" fill="#444441" text-anchor="middle">route in private-rt</text>

<line x1="340" y1="261" x2="385" y2="333" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="261" x2="455" y2="333" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="352" y="294" font-size="11" fill="#2C2C2A" text-anchor="end">SSH 22</text>
<text x="490" y="294" font-size="11" fill="#2C2C2A">port 8080</text>
<line x1="492" y1="367" x2="518" y2="367" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="520" y="480" width="140" height="60" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="590" y="506" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">S3 data bucket</text>
<text x="590" y="524" font-size="11" fill="#444441" text-anchor="middle">private, versioned</text>
<line x1="590" y1="401" x2="590" y2="478" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="860" y="50" width="210" height="300" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text x="872" y="70" font-size="12" font-weight="bold" fill="#633806">Simulated on-prem</text>
<text x="872" y="86" font-size="11" fill="#854F0B">onprem-vpc 192.168.0.0/16</text>

<rect x="878" y="100" width="174" height="64" rx="6" fill="#FFFFFF" stroke="#854F0B"/>
<text x="965" y="126" font-size="13" font-weight="bold" fill="#633806" text-anchor="middle">strongSwan server</text>
<text x="965" y="144" font-size="11" fill="#854F0B" text-anchor="middle">Ubuntu, Elastic IP</text>

<rect x="878" y="260" width="174" height="60" rx="6" fill="#FFFFFF" stroke="#854F0B"/>
<text x="965" y="286" font-size="13" font-weight="bold" fill="#633806" text-anchor="middle">Office host</text>
<text x="965" y="304" font-size="11" fill="#854F0B" text-anchor="middle">192.168.10.x</text>
<line x1="965" y1="258" x2="965" y2="166" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="882" y="210" font-size="11" fill="#633806">Route-based</text>
<text x="882" y="224" font-size="11" fill="#633806">VTI + routes</text>

<line x1="762" y1="128" x2="876" y2="128" stroke="#BA7517" stroke-width="3" marker-start="url(#t)" marker-end="url(#t)"/>
<text x="825" y="150" font-size="11" font-weight="bold" fill="#854F0B" text-anchor="middle">IPsec</text>
<text x="825" y="164" font-size="11" font-weight="bold" fill="#854F0B" text-anchor="middle">tunnel</text>

<text x="30" y="606" font-size="13" font-weight="bold" fill="#2C2C2A">Monitoring, operations and automation</text>

<rect x="30" y="616" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="110" y="638" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">CloudTrail</text>
<text x="110" y="656" font-size="11" fill="#444441" text-anchor="middle">who did what</text>

<rect x="205" y="616" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="285" y="638" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">VPC Flow Logs</text>
<text x="285" y="656" font-size="11" fill="#444441" text-anchor="middle">accept and reject</text>

<rect x="380" y="616" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="460" y="638" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Logging bucket</text>
<text x="460" y="656" font-size="11" fill="#444441" text-anchor="middle">14-day expiry</text>

<rect x="555" y="616" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="635" y="638" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">CloudWatch alarm</text>
<text x="635" y="656" font-size="11" fill="#444441" text-anchor="middle">SNS email alert</text>

<rect x="730" y="616" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="810" y="638" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">SSM Patch Manager</text>
<text x="810" y="656" font-size="11" fill="#444441" text-anchor="middle">baseline + window</text>

<rect x="905" y="616" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="985" y="638" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Terraform + boto3</text>
<text x="985" y="656" font-size="11" fill="#444441" text-anchor="middle">IaC and audit script</text>
</svg>
